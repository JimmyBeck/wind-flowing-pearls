<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>风起流珠 · wind-flowing-pearls | 作者：崽崽</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* 顶部双行紧凑控制栏 */
    .hud {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      z-index: 10;
      background: rgba(16, 22, 28, 0.88);
      border: 1px solid rgba(190, 240, 238, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 16px;
      max-width: 96vw;
    }
    .hud-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .hud-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .hud-label {
      color: rgba(185, 230, 228, 0.58);
      font-size: 11px;
      margin: 0 3px;
    }
    .hud-btn {
      background: transparent;
      border: none;
      color: rgba(215, 242, 240, 0.72);
      font-size: 12px;
      padding: 3px 9px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .hud-btn:hover { color: #ffffff; }
    .hud-btn.active {
      background: rgba(165, 240, 232, 0.22);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(150, 235, 225, 0.28);
      font-weight: 500;
    }
    .divider {
      width: 1px;
      height: 13px;
      background: rgba(190, 240, 238, 0.18);
      margin: 0 3px;
    }

    /* 滑块 */
    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 3px;
    }
    .slider-wrap input[type="range"] {
      width: 64px;
      accent-color: #b2f5ea;
      cursor: pointer;
    }
    .scale-val {
      color: #ffffff;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      min-width: 30px;
    }

    /* 严格锁定 9:16 竖屏画布容器 */
    .stage-container {
      position: relative;
      height: calc(100vh - 108px);
      aspect-ratio: 9 / 16;
      max-width: 94vw;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(160, 240, 230, 0.05);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    .ratio-badge {
      position: absolute;
      bottom: 8px;
      right: 10px;
      color: rgba(255, 255, 255, 0.22);
      font-size: 10px;
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* 画布外左侧项目介绍展签（零占用 9:16 主画布面积） */
    .project-plaque {
      position: fixed;
      left: 36px;
      bottom: 34px;
      z-index: 5;
      pointer-events: none;
      border-left: 1.5px solid rgba(180, 240, 232, 0.28);
      padding-left: 14px;
    }
    .plaque-title {
      color: rgba(238, 252, 250, 0.9);
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 4px;
      line-height: 1.2;
    }
    .plaque-en {
      color: rgba(175, 232, 226, 0.5);
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 1.2px;
      margin-top: 5px;
    }
    .plaque-author {
      color: rgba(215, 245, 242, 0.72);
      font-size: 12px;
      letter-spacing: 1.5px;
      margin-top: 12px;
    }
    .plaque-hint {
      color: rgba(175, 222, 218, 0.36);
      font-size: 11px;
      letter-spacing: 0.8px;
      margin-top: 5px;
    }

    @media (max-width: 900px) {
      .project-plaque { display: none; }
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="hud-row">
      <div class="hud-group">
        <span class="hud-label">造型</span>
        <button class="hud-btn active" data-layout="hat">参考图流瀑</button>
        <button class="hud-btn" data-layout="staggered">均匀错落</button>
        <button class="hud-btn" data-layout="uniform">等长整齐</button>
      </div>

      <div class="divider"></div>

      <div class="hud-group">
        <button class="hud-btn" id="backLayerBtn" title="开关后景半透明衬底珠链">后景深: 关</button>
      </div>

      <div class="divider"></div>

      <div class="hud-group">
        <span class="hud-label">打散</span>
        <button class="hud-btn active" data-mode="fall">重力下坠</button>
        <button class="hud-btn" data-mode="float">向上飘散</button>
        <button class="hud-btn" data-mode="unbreakable">不断裂</button>
      </div>

      <div class="divider"></div>

      <button class="hud-btn" id="resetBtn">重置</button>
    </div>

    <div class="hud-row">
      <div class="slider-wrap">
        <span class="hud-label">微风</span>
        <input type="range" id="windStrengthSlider" min="0" max="2.5" step="0.05" value="1.0" />
        <span class="scale-val" id="windStrengthVal">1.0x</span>
      </div>

      <div class="divider"></div>

      <div class="slider-wrap">
        <span class="hud-label">鼠标力度</span>
        <input type="range" id="mouseSensSlider" min="0.1" max="2.0" step="0.05" value="0.55" />
        <span class="scale-val" id="mouseSensVal">0.55x</span>
      </div>

      <div class="divider"></div>

      <div class="slider-wrap">
        <span class="hud-label">密度</span>
        <input type="range" id="chainCountSlider" min="6" max="40" step="1" value="16" />
        <span class="scale-val" id="chainCountVal">16根</span>
      </div>

      <div class="divider"></div>

      <div class="slider-wrap">
        <span class="hud-label">珠子大小</span>
        <input type="range" id="beadScaleSlider" min="0.15" max="2.5" step="0.05" value="1.0" />
        <span class="scale-val" id="beadScaleVal">1.0x</span>
      </div>
    </div>
  </div>

  <div class="stage-container" id="stageContainer">
    <canvas id="stage"></canvas>
    <div class="ratio-badge">9 : 16</div>
  </div>

  <aside class="project-plaque" aria-label="项目介绍">
    <h1 class="plaque-title">风起流珠</h1>
    <div class="plaque-en">wind-flowing-pearls</div>
    <div class="plaque-author">作者：崽崽</div>
    <div class="plaque-hint">轻拂生波 · 疾掠散珠 · 双击复原</div>
  </aside>

  <script src="crystal.js?v=2.1"></script>
  <script src="main.js?v=2.1"></script>
</body>
</html>
